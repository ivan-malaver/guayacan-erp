# Proyecto Python del Puente IoT. Instalar (desde servicios/iot, con su venv activo):  pip install -e ".[dev]"

[project]
name = "guayacan-iot"
version = "0.1.0"
description = "Puente IoT (FastAPI, fase 4): MQTT de la red local hacia el ERP"
requires-python = ">=3.12"
# Versiones mínimas; fije las exactas con pip freeze al instalar por primera vez.
dependencies = [
    "fastapi>=0.115",            # framework web para APIs
    "uvicorn[standard]>=0.32",  # servidor que corre FastAPI
    "httpx>=0.27",               # cliente HTTP para llamar al ERP
    "paho-mqtt>=2.1",            # cliente MQTT para hablar con la pasarela de la finca
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]  # pruebas y revisor de estilo

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]  # para que las pruebas encuentren el paquete app

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
